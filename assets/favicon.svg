<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2d34"/>
      <stop offset="100%" stop-color="#141619"/>
    </linearGradient>
    <linearGradient id="platenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#40444b"/>
      <stop offset="100%" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#e8e2d2"/>
    </linearGradient>
  </defs>
  <!-- Background soft shadow / base -->
  <rect x="4" y="24" width="56" height="34" rx="6" fill="#0d0e11"/>
  <!-- Paper sticking up -->
  <rect x="18" y="6" width="28" height="22" rx="2" fill="url(#paperGrad)"/>
  <!-- Paper lines -->
  <line x1="22" y1="12" x2="38" y2="12" stroke="#b3ab96" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="16" x2="42" y2="16" stroke="#c43d3d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="20" x2="34" y2="20" stroke="#b3ab96" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Platen roller -->
  <rect x="10" y="20" width="44" height="8" rx="4" fill="url(#platenGrad)" stroke="#525861" stroke-width="0.8"/>
  <!-- Typewriter main chassis -->
  <path d="M 8 28 L 56 28 L 58 56 C 58 58 56 60 54 60 L 10 60 C 8 60 6 58 6 56 Z" fill="url(#bodyGrad)" stroke="#4a505b" stroke-width="1"/>
  <!-- Ribbon vibrator / center guide -->
  <polygon points="32,26 29,32 35,32" fill="#c43d3d"/>
  <!-- Key buttons (3 rows) -->
  <!-- Row 1 -->
  <circle cx="16" cy="37" r="2.5" fill="#e8e2d2" stroke="#222" stroke-width="0.8"/>
  <circle cx="24" cy="37" r="2.5" fill="#e8e2d2" stroke="#222" stroke-width="0.8"/>
  <circle cx="32" cy="37" r="2.5" fill="#e8e2d2" stroke="#222" stroke-width="0.8"/>
  <circle cx="40" cy="37" r="2.5" fill="#e8e2d2" stroke="#222" stroke-width="0.8"/>
  <circle cx="48" cy="37" r="2.5" fill="#e8e2d2" stroke="#222" stroke-width="0.8"/>
  <!-- Row 2 -->
  <circle cx="20" cy="44" r="2.5" fill="#e8e2d2" stroke="#222" stroke-width="0.8"/>
  <circle cx="28" cy="44" r="2.5" fill="#e8e2d2" stroke="#222" stroke-width="0.8"/>
  <circle cx="36" cy="44" r="2.5" fill="#e8e2d2" stroke="#222" stroke-width="0.8"/>
  <circle cx="44" cy="44" r="2.5" fill="#e8e2d2" stroke="#222" stroke-width="0.8"/>
  <!-- Spacebar -->
  <rect x="20" y="50" width="24" height="3" rx="1.5" fill="#d6cebd" stroke="#222" stroke-width="0.8"/>
</svg>
